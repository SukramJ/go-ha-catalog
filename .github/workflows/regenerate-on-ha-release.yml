name: "Regenerate: on Home Assistant release"
# Regenerates the catalog whenever Home Assistant ships a stable release and
# opens a pull request with the result — unattended, auto-merged as soon as the
# required checks are green.
#
# Home Assistant cannot fire a repository_dispatch at us the way openccu-data
# can, so the trigger is a poll of its releases API. Betas are skipped.
#
# Every stable release triggers a regeneration, patch releases included: Home
# Assistant ships many of those and most never touch the vocabulary, so the
# guard against tag noise is not the trigger but the diff. A vocabulary-neutral
# release still gets a PR — without the committed stamp the daily poll would
# re-extract the same release forever — it just produces no tag.
#
# Tagging does not happen here. This workflow ends at the pull request, and
# tag-on-regen-merge.yml pushes the tag once the PR lands on main: the merge is
# asynchronous, so a tag pushed from this job would point at a branch commit
# that may never become main at all.
#
# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: "17 5 * * *" # daily 05:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "home-assistant/core tag to regenerate from (default: latest stable)"
        required: false
      force:
        description: "re-extract even when the stamp already matches upstream"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regenerate
  cancel-in-progress: false

jobs:
  regenerate:
    if: github.repository_owner == 'SukramJ'
    runs-on: ubuntu-latest
    steps:
      # Checked out with the PAT rather than GITHUB_TOKEN: a branch pushed and
      # a pull request opened with GITHUB_TOKEN do not trigger ci.yml or
      # codeql.yml, so the five required status checks would never report and
      # auto-merge would wait forever.
      #
      # The PAT therefore needs contents:write and pull-requests:write on this
      # repository. A read-only token does not fail at checkout — this repo is
      # public, so the clone succeeds — it fails at the branch push with
      # "Permission to SukramJ/go-ha-catalog.git denied to SukramJ" and a 403.
      - name: Checkout go-ha-catalog
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.RELEASE_PAT }}
          fetch-depth: 0 # the regen branch may already exist from an earlier poll

      - name: Resolve the Home Assistant release to track
        id: resolve
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            TAG="${INPUT_TAG}"
          else
            # /releases/latest excludes prereleases by definition, which is
            # exactly the "stable only" rule.
            TAG="$(gh api repos/home-assistant/core/releases/latest --jq .tag_name)"
          fi
          [ -n "$TAG" ] || { echo "could not resolve a Home Assistant tag" >&2; exit 1; }

          CURRENT="$(sed -n 's/^const SnapshotVersion = "\(.*\)"$/\1/p' hacatalog.go)"
          echo "upstream=$TAG"    >> "$GITHUB_OUTPUT"
          echo "current=$CURRENT" >> "$GITHUB_OUTPUT"
          echo "Home Assistant latest stable: $TAG (catalog holds $CURRENT)"

          if [ "$TAG" = "$CURRENT" ] && [ "${{ github.event.inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "catalog is already at $TAG — nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout home-assistant/core at that tag
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: home-assistant/core
          ref: ${{ steps.resolve.outputs.upstream }}
          path: ha-core
          fetch-depth: 0 # the extractor stamps `git describe --tags`

      - name: Set up Go
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Python
        if: steps.resolve.outputs.skip != 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          # Home Assistant pins a minimum in its pyproject; read it rather than
          # hard-coding a version that will age out.
          python-version-file: ha-core/.python-version

      - name: Keep the previous catalog for comparison
        if: steps.resolve.outputs.skip != 'true'
        run: cp -r data /tmp/old-data

      - name: Regenerate
        if: steps.resolve.outputs.skip != 'true'
        run: script/regenerate.sh ha-core

      # Only for the PR title and body. The verdict that decides the tag is
      # recomputed after the merge, from what actually landed on main.
      - name: Classify the change
        if: steps.resolve.outputs.skip != 'true'
        id: diff
        run: |
          set -euo pipefail
          go build -o /tmp/hadiff ./script/hadiff
          # hadiff exits non-zero to signal a verdict, so it must not abort the
          # step; the JSON is the contract, the exit code only a convenience.
          set +e
          /tmp/hadiff -old /tmp/old-data -new data -format json > /tmp/hadiff.json
          set -e
          cat /tmp/hadiff.json
          BUMP="$(jq -r .bump /tmp/hadiff.json)"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          /tmp/hadiff -old /tmp/old-data -new data > /tmp/hadiff.txt || true

      - name: Verify the regenerated catalog
        if: steps.resolve.outputs.skip != 'true'
        env:
          CGO_ENABLED: "1"
        run: go test -race -count=1 -timeout=120s ./...

      # One pull request per regeneration, vocabulary-neutral or not. Whether
      # it also becomes a release is decided after the merge — see
      # tag-on-regen-merge.yml.
      - name: Open the regeneration PR
        if: steps.resolve.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PAT }}
          UPSTREAM: ${{ steps.resolve.outputs.upstream }}
          BUMP: ${{ steps.diff.outputs.bump }}
        run: |
          set -euo pipefail
          rm -rf ha-core .venv

          # `git status --porcelain` also catches untracked files (a data file
          # for a platform that did not exist before) — `git diff` would miss
          # them.
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing changed at all"
            exit 0
          fi

          case "$BUMP" in
          major) SUBJECT="feat(catalog)!: Home Assistant ${UPSTREAM} (vocabulary removals)" ;;
          none)  SUBJECT="chore(catalog): track Home Assistant ${UPSTREAM} (no vocabulary change)" ;;
          *)     SUBJECT="feat(catalog): Home Assistant ${UPSTREAM}" ;;
          esac

          BRANCH="regen/ha-${UPSTREAM}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add -A
          git commit -m "$SUBJECT"

          # The daily poll keeps resolving the same upstream tag until the
          # stamp is on main, so this branch can already exist from a run whose
          # PR is still open. Overwrite it instead of failing the job every day
          # until someone looks.
          git push --force-with-lease -u origin "$BRANCH"

          {
            echo "Automated regeneration from Home Assistant \`${UPSTREAM}\`."
            echo
            echo "hadiff verdict: \`${BUMP}\`"
            echo
            echo '```'
            cat /tmp/hadiff.txt
            echo '```'
            echo
            if [ "$BUMP" = "none" ]; then
              echo "The vocabulary did not move, so no tag follows this merge — that is what"
              echo "keeps Home Assistant's many vocabulary-neutral patch releases from"
              echo "generating tag noise. The PR carries the snapshot stamp only, without"
              echo "which the daily poll would re-extract \`${UPSTREAM}\` forever."
            else
              echo "\`tag-on-regen-merge.yml\` tags and releases this once it lands on main."
            fi
          } > /tmp/pr-body.md

          # Matched on state, not just on the branch: `gh pr view <branch>`
          # also resolves a PR that was closed unmerged, and editing that one
          # would leave the new branch without a PR at all.
          PR="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$PR" ]; then
            gh pr edit "$PR" --title "$SUBJECT" --body-file /tmp/pr-body.md
          else
            PR="$(gh pr create --base main --head "$BRANCH" \
              --title "$SUBJECT" --body-file /tmp/pr-body.md)"
          fi

          # Asking first rather than relying on `gh pr merge --auto` being a
          # no-op the second time round: on a re-run the PR already has
          # auto-merge armed, and a daily job that fails on that is noise.
          if [ "$(gh pr view "$PR" --json autoMergeRequest --jq '.autoMergeRequest != null')" != "true" ]; then
            gh pr merge --auto --squash "$PR"
          fi
          echo "regeneration PR: $PR"
